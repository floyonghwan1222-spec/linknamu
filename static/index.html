<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>링크나무</title>
<meta name="description" content="내 모든 링크를 한 페이지에 모아두고, 하나의 URL로 공유하는 서비스" />
<style>
  :root {
    --bg: #ffffff;
    --fg: #171717;
    --muted: #737373;
    --card-bg: #ffffff;
    --card-border: #e5e5e5;
    --avatar-bg: #f5f5f5;
    --avatar-fg: #a3a3a3;
    --toggle-bg: #ffffff;
    --toggle-border: #e5e5e5;
    --toggle-hover: #f5f5f5;
  }

  [data-theme="dark"] {
    --bg: #171717;
    --fg: #f5f5f5;
    --muted: #a3a3a3;
    --card-bg: #262626;
    --card-border: #404040;
    --avatar-bg: #262626;
    --avatar-fg: #737373;
    --toggle-bg: #262626;
    --toggle-border: #404040;
    --toggle-hover: #333333;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
    transition: background 0.2s ease, color 0.2s ease;
  }

  main {
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  .toggle-row {
    width: 100%;
    display: flex;
    justify-content: flex-end;
  }

  #theme-toggle {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1px solid var(--toggle-border);
    background: var(--toggle-bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  #theme-toggle:hover {
    background: var(--toggle-hover);
  }

  #theme-toggle svg {
    width: 20px;
    height: 20px;
  }

  .profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--avatar-bg);
    border: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: var(--avatar-fg);
    overflow: hidden;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .profile h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  .profile p {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-card {
    display: block;
    width: 100%;
    padding: 16px 20px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--fg);
    text-decoration: none;
    text-align: center;
    font-weight: 500;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .link-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
  }

  .link-card:active {
    transform: translateY(0);
  }
</style>
</head>
<body>
  <main>
    <div class="container">
      <div class="toggle-row">
        <button id="theme-toggle" type="button" aria-label="다크 모드 전환"></button>
      </div>

      <div class="profile">
        <div class="avatar">
          <span id="avatar-fallback">김</span>
        </div>
        <h1>김용환</h1>
        <p>EHS전문가</p>
      </div>

      <nav class="links">
        <a class="link-card" href="https://example.com/blog" target="_blank" rel="noopener noreferrer">블로그</a>
        <a class="link-card" href="https://instagram.com" target="_blank" rel="noopener noreferrer">인스타그램</a>
        <a class="link-card" href="mailto:contact@example.com">이메일 문의</a>
      </nav>
    </div>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      var toggleBtn = document.getElementById("theme-toggle");

      var sunIcon =
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.25a.75.75 0 01.75.75v2a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.415 1.414a.75.75 0 001.06 1.06l1.415-1.414zM21.75 12a.75.75 0 01-.75.75h-2a.75.75 0 010-1.5h2a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.414-1.415a.75.75 0 10-1.06 1.06l1.414 1.415zM12 18a.75.75 0 01.75.75v2a.75.75 0 01-1.5 0v-2A.75.75 0 0112 18zM7.758 17.834a.75.75 0 10-1.06-1.06l-1.415 1.414a.75.75 0 001.06 1.06l1.415-1.414zM6 12a.75.75 0 01-.75.75h-2a.75.75 0 010-1.5h2A.75.75 0 016 12zM6.166 7.758a.75.75 0 001.06-1.06L5.813 5.283a.75.75 0 10-1.06 1.06l1.413 1.415z"/></svg>';
      var moonIcon =
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"/></svg>';

      function applyTheme(theme) {
        if (theme === "dark") {
          root.setAttribute("data-theme", "dark");
          toggleBtn.innerHTML = sunIcon;
        } else {
          root.removeAttribute("data-theme");
          toggleBtn.innerHTML = moonIcon;
        }
      }

      var stored = localStorage.getItem("linknamu-theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      applyTheme(stored || (prefersDark ? "dark" : "light"));

      toggleBtn.addEventListener("click", function () {
        var isDark = root.getAttribute("data-theme") === "dark";
        var next = isDark ? "light" : "dark";
        applyTheme(next);
        localStorage.setItem("linknamu-theme", next);
      });
    })();
  </script>
</body>
</html>
